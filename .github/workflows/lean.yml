name: Lean proofs and experiment checks

on:
  # Run full verification from the Actions tab when a revision is ready.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The Mathlib build plus the compressed .lake cache can exhaust the runner's disk;
      # drop preinstalled toolchains this job does not use.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build pinned Lean and Mathlib
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Audit every project declaration for axioms and resolve the names cited in the docs
        run: lake env lean scripts/AxiomAudit.lean
      - name: Check modules, exports, layering, docstrings, the trust boundary, the registry and the docs
        run: python3 scripts/check_contracts.py
      - name: Compile the Lean examples in the README
        run: |
          python3 scripts/check_contracts.py --extract-examples "$RUNNER_TEMP/readme-examples"
          for example in "$RUNNER_TEMP"/readme-examples/*.lean; do
            lake env lean "$example"
          done
      - name: Check Python style
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          .venv/bin/ruff check scripts experiments tests showcase
          .venv/bin/ruff format --check scripts experiments tests showcase
      - name: Run exact and numerical illustration tests
        run: python3 -m unittest discover -s tests -v
