name = "formalize-sampling"
version = "0.1.0"
defaultTargets = ["FormalizeSampling"]
# A project that requires this package at a tagged commit downloads the prebuilt library from
# the GitHub release of that tag (.github/workflows/release.yml, Linux x86_64 only); on other
# platforms, or at an untagged commit, Lake builds the library from source.
preferReleaseBuild = true
releaseRepo = "https://github.com/hendrydong/FormalizeSampling"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "FormalizeSampling"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
